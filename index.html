<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronósticos VGA 2026 · Checkpoint Remastered</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===========================================
   THEME — mismo esquema que la presentación de Galerians
   =========================================== */
:root {
    --stage-bg: #161c2b;
    --abyss: #1a2132;
    --navy: #222a3e;
    --panel: #2b3449;
    --panel-line: rgba(255,255,255,0.07);
    --text: #e8e1c5;
    --muted: #aaa591;
    --dim: #737788;
    --accent: #fd5006;
    --accent-2: #fbb920;
    --hot: #e30102;
    --glow: rgba(253,80,6,0.35);

    --font-display: 'Chakra Petch', sans-serif;
    --font-body: 'Hanken Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
    font-family: var(--font-body); color: var(--text);
    background:
        radial-gradient(1200px 700px at 78% -10%, rgba(251,185,32,0.07), transparent 60%),
        radial-gradient(900px 600px at 0% 110%, rgba(227,1,2,0.08), transparent 60%),
        linear-gradient(180deg, #28314a 0%, var(--navy) 38%, var(--abyss) 100%) fixed;
    background-color: var(--stage-bg);
    min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ===========================================
   ATMÓSFERA — grilla + scanlines + ondas + franja
   =========================================== */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.fx .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
}
.fx .scan {
    position: absolute; inset: 0; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 4px);
}
.sonar { position: absolute; left: 50%; top: 42%; width: 10px; height: 10px; transition: opacity 1s ease; }
body:not(.on-intro) .sonar { opacity: 0; }
.sonar span {
    position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px;
    margin: -750px 0 0 -750px; border-radius: 50%;
    border: 2px solid rgba(251,185,32,0.22);
    animation: ping 6s var(--ease-out-expo) infinite; transform: scale(0); opacity: 0;
}
.sonar span:nth-child(2) { animation-delay: 2s; border-color: rgba(253,80,6,0.18); }
.sonar span:nth-child(3) { animation-delay: 4s; }
@keyframes ping { 0% { transform: scale(0.05); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
.hull-stripe {
    position: fixed; left: 0; right: 0; bottom: 0; height: 6px; z-index: 30;
    background: linear-gradient(90deg, var(--hot), var(--accent) 35%, var(--accent-2) 70%, var(--text));
}

/* ===========================================
   LAYOUT
   =========================================== */
.app {
    position: relative; z-index: 1;
    max-width: 1180px; margin: 0 auto;
    padding: 28px 16px 120px;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
}
@media (min-width: 720px) { .app { padding: 48px 48px 130px; } }

.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* Entrada escalonada (equivalente a .reveal de la presentación) */
.reveal {
    opacity: 0; transform: translateY(26px);
    transition: opacity .7s var(--ease-out-expo), transform .7s var(--ease-out-expo);
    transition-delay: calc(var(--d, 0) * 70ms + 60ms);
}
.screen.shown .reveal { opacity: 1; transform: none; }

/* ===========================================
   INTRO
   =========================================== */
#intro { align-items: center; justify-content: center; text-align: center; gap: 22px; }
#intro .logo { width: min(420px, 78vw); height: auto; }
#intro .meta {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 5px;
    color: var(--accent-2); text-transform: uppercase;
}
#intro h1 {
    font-family: var(--font-display); font-weight: 700; line-height: .95;
    font-size: clamp(46px, 10vw, 110px); letter-spacing: -1px;
    text-shadow: 0 10px 50px rgba(0,0,0,0.6);
}
#intro h1 em { font-style: normal; color: var(--accent); text-shadow: 0 0 60px var(--glow); }
#intro .sub { font-size: clamp(17px, 2.4vw, 22px); color: var(--muted); font-style: italic; max-width: 560px; }
.alias-box { display: flex; flex-direction: column; gap: 10px; width: min(440px, 100%); margin-top: 8px; }
.alias-box label {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px;
    color: var(--dim); text-transform: uppercase; text-align: left;
}
.alias-box input {
    width: 100%; padding: 16px 18px; border-radius: 12px;
    font: 600 20px var(--font-display); color: var(--text);
    background: rgba(26,33,50,0.9); border: 1px solid rgba(251,185,32,0.25);
    outline: none; transition: border-color .2s, box-shadow .2s;
}
.alias-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(253,80,6,0.18); }
.alias-box .err { min-height: 18px; font-size: 14px; color: var(--hot); text-align: left; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 26px; border-radius: 12px;
    font: 700 18px var(--font-display); letter-spacing: 1px; text-transform: uppercase;
    background: var(--accent); color: #1a1208;
    box-shadow: 0 14px 34px -12px var(--glow);
    transition: transform .2s var(--ease-out-expo), filter .2s, opacity .2s;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost {
    background: transparent; color: var(--text);
    border: 1px solid rgba(232,225,197,0.2); box-shadow: none;
}
.btn.ghost:hover { border-color: var(--accent-2); color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }

/* ===========================================
   CATEGORÍA
   =========================================== */
.head { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
.head .bar { flex: none; width: 7px; align-self: stretch; min-height: 44px; background: var(--accent); box-shadow: 0 0 24px var(--glow); }
.head h2 {
    font-family: var(--font-display); font-weight: 700; line-height: 1;
    font-size: clamp(30px, 5.4vw, 60px); letter-spacing: -.5px;
}
.kicker {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px;
    color: var(--dim); text-transform: uppercase; margin: 0 0 22px 25px;
}
.kicker b { color: var(--accent-2); }

.cards { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 980px) { .cards { grid-template-columns: repeat(3, 1fr); gap: 18px; } }

.card {
    position: relative; text-align: left; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    flex-direction: row; justify-content: flex-start; gap: 0; padding: 0; border-radius: 16px;
    background: linear-gradient(180deg, rgba(46,56,80,0.85), rgba(34,42,62,0.85));
    border: 1px solid var(--panel-line);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: transform .35s var(--ease-out-expo), border-color .25s, box-shadow .25s, opacity .3s, filter .3s;
}
/* Portada (3:4) a la izquierda; si falta la imagen, se ven las iniciales */
.card .cover {
    position: relative; flex: none; width: 84px; aspect-ratio: 3 / 4; overflow: hidden;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 12px, transparent 12px 24px), #1c2334;
    display: grid; place-items: center;
    font: 700 26px var(--font-display); color: rgba(232,225,197,0.25);
}
.card .cover img {
    position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
    object-fit: cover; display: block;
    transition: transform .6s var(--ease-out-expo);
}
.card .cover::after { /* fundido hacia el cuerpo de la tarjeta */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 70%, rgba(34,42,62,0.55));
}
.card .cover img.wide { object-fit: contain; padding: 8px; background: #1c2334; } /* logos apaisados: no recortar */
.card:hover .cover img { transform: scale(1.05); }
.card .body {
    flex: 1; min-width: 0; padding: 12px 14px 12px 16px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
}
@media (min-width: 640px) {
    .card .cover { width: 108px; }
    .card .body { padding: 16px 18px; }
}
@media (min-width: 980px) { .card .cover { width: 120px; } }
.card::before { /* franja lateral tipo logo */
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; z-index: 2;
    background: linear-gradient(180deg, var(--accent-2), var(--accent) 50%, var(--hot));
    opacity: 0; transition: opacity .25s;
}
.card:hover { transform: translateY(-3px); border-color: rgba(251,185,32,0.3); }
.card:hover::before { opacity: .6; }
.card .num {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; color: var(--dim);
    display: flex; justify-content: space-between; align-items: center;
}
.card .check {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid rgba(232,225,197,0.25);
    display: grid; place-items: center; transition: all .25s;
}
.card .check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: all .3s var(--ease-out-expo); }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: clamp(19px, 2.2vw, 23px); line-height: 1.12; overflow-wrap: anywhere; }
.card .game { display: block; margin-top: 6px; font: italic 500 15px var(--font-body); color: var(--muted); }

.card.picked {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(253,80,6,0.18), rgba(34,42,62,0.92));
    box-shadow: 0 0 0 1px var(--accent), 0 24px 50px -20px var(--glow);
}
.card.picked::before { opacity: 1; }
.card.picked .num { color: var(--accent-2); }
.card.picked .check { background: var(--accent); border-color: var(--accent); }
.card.picked .check svg { opacity: 1; transform: none; }
.cards.has-pick .card:not(.picked) { opacity: .6; filter: saturate(.7); }
.cards.has-pick .card:not(.picked):hover { opacity: 1; filter: none; }

.cat-nav { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.cat-nav .spacer { flex: 1; }
.hint { font-family: var(--font-mono); font-size: 12px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
@media (max-width: 979px) { .hint { display: none; } }

/* ===========================================
   RESUMEN
   =========================================== */
.summary { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .summary { grid-template-columns: repeat(2, 1fr); } }
.row {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    padding: 14px 16px; border-radius: 12px;
    background: rgba(34,42,62,0.75); border: 1px solid var(--panel-line);
    transition: border-color .2s, transform .2s var(--ease-out-expo);
}
.row:hover { border-color: rgba(251,185,32,0.35); transform: translateX(3px); }
.row .idx { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--dim); width: 22px; }
.row .txt { flex: 1; min-width: 0; }
.row .cat { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
.row .pick { display: block; margin-top: 4px; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.15; }
.row.empty .pick { color: var(--dim); font-style: italic; font-weight: 500; }
.row .edit { flex: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--accent-2); opacity: .7; }
.voter { font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px; color: var(--muted); margin: 0 0 18px 25px; text-transform: uppercase; }
.voter b { color: var(--text); }
.send-bar { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.send-bar .note { font-size: 14px; color: var(--muted); }
.send-bar .note.err { color: var(--hot); }

/* ===========================================
   FINAL
   =========================================== */
#done { align-items: center; justify-content: center; text-align: center; gap: 20px; }
#done .badge {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 5px; color: var(--accent-2); text-transform: uppercase;
}
#done h1 {
    font-family: var(--font-display); font-weight: 700; line-height: .95;
    font-size: clamp(50px, 11vw, 140px); color: var(--accent); text-shadow: 0 0 60px var(--glow);
}
#done p { font-size: 19px; color: var(--muted); max-width: 520px; }
#done .goty {
    margin-top: 6px; padding: 18px 26px; border-radius: 16px;
    background: rgba(26,33,49,0.9); border: 1px solid rgba(251,185,32,0.35); border-left: 6px solid var(--accent);
}
#done .goty small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
#done .goty b { display: block; margin-top: 6px; font-family: var(--font-display); font-size: 26px; }

/* ===========================================
   HUD inferior — progreso
   =========================================== */
.hud {
    position: fixed; left: 0; right: 0; bottom: 6px; z-index: 20;
    padding: 12px 16px; display: flex; align-items: center; gap: 16px;
    background: linear-gradient(0deg, rgba(22,28,43,0.96), rgba(22,28,43,0.75));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid var(--panel-line);
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase;
    transition: transform .5s var(--ease-out-expo);
}
@media (min-width: 720px) { .hud { padding: 14px 48px; } }
body.on-intro .hud, body.on-done .hud { transform: translateY(120%); }
.hud img { height: 22px; width: auto; flex: none; }
.hud .track { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.07); overflow: hidden; }
.hud .fill {
    height: 100%; width: 0; border-radius: 4px;
    background: linear-gradient(90deg, var(--hot), var(--accent) 50%, var(--accent-2));
    transition: width .6s var(--ease-out-expo);
}
.hud .count b { color: var(--accent); }
.hud .who { display: none; }
@media (min-width: 720px) { .hud .who { display: inline; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
</style>
</head>
<body class="on-intro">

<div class="fx" aria-hidden="true">
    <div class="grid"></div>
    <div class="scan"></div>
    <div class="sonar"><span></span><span></span><span></span></div>
</div>
<div class="hull-stripe" aria-hidden="true"></div>

<main class="app">

    <!-- INTRO -->
    <section class="screen" id="intro">
        <img class="logo reveal" style="--d:0" src="assets/logo-cierre.png" alt="Checkpoint Remastered">
        <div class="meta reveal" style="--d:1">The Game Awards · 2026</div>
        <h1 class="reveal" style="--d:2">Pronósticos<br><em>VGA 2026</em></h1>
        <p class="sub reveal" style="--d:3">Elegí quién creés que se lleva cada premio. Después de la ceremonia vemos quién la vio venir.</p>
        <form class="alias-box reveal" style="--d:4" id="aliasForm" novalidate>
            <label for="alias">Tu alias</label>
            <input id="alias" name="alias" type="text" maxlength="40" autocomplete="nickname" placeholder="Ej: diego_shepard" required>
            <div class="err" id="aliasErr" role="alert"></div>
            <button class="btn" type="submit" id="startBtn">Empezar ▸</button>
        </form>
    </section>

    <!-- CATEGORÍA -->
    <section class="screen" id="cat">
        <div class="head reveal" style="--d:0">
            <span class="bar"></span>
            <h2 id="catTitle"></h2>
        </div>
        <div class="kicker reveal" style="--d:1" id="catKicker"></div>
        <div class="cards" id="cards"></div>
        <div class="cat-nav reveal" style="--d:9">
            <button class="btn ghost" id="prevBtn" type="button">◂ Anterior</button>
            <span class="spacer"></span>
            <span class="hint">Teclas 1–6 eligen · ← → navegan</span>
            <button class="btn" id="nextBtn" type="button">Siguiente ▸</button>
        </div>
    </section>

    <!-- RESUMEN -->
    <section class="screen" id="review">
        <div class="head reveal" style="--d:0">
            <span class="bar"></span>
            <h2>Tu boleta</h2>
        </div>
        <div class="voter reveal" style="--d:1">Votante: <b id="voterName"></b></div>
        <div class="summary" id="summary"></div>
        <div class="send-bar reveal" style="--d:6">
            <button class="btn ghost" id="backBtn" type="button">◂ Volver</button>
            <button class="btn" id="sendBtn" type="button">Enviar pronóstico ▸</button>
            <span class="note" id="sendNote" role="status"></span>
        </div>
    </section>

    <!-- FINAL -->
    <section class="screen" id="done">
        <div class="badge reveal" style="--d:0">Checkpoint guardado</div>
        <h1 class="reveal" style="--d:1">¡Voto<br>registrado!</h1>
        <p class="reveal" style="--d:2" id="doneText"></p>
        <div class="goty reveal" style="--d:3" id="gotyBox"><small>Tu Game of the Year</small><b id="gotyPick"></b></div>
        <button class="btn ghost reveal" style="--d:4" id="againBtn" type="button">Cambiar mi pronóstico</button>
    </section>

</main>

<div class="hud" aria-hidden="true">
    <img src="assets/logo-mini.png" alt="">
    <span class="count" id="hudCount"></span>
    <div class="track"><div class="fill" id="hudFill"></div></div>
    <span class="who" id="hudWho"></span>
</div>

   =========================================== */
const CONFIG = /*CONFIG*/{"formAction":"https://docs.google.com/forms/d/e/1FAIpQLScj8R731GWt3ht4KwVmzJQOmSWBcXGkbSP9ODIu8PnUI02-0g/formResponse","aliasEntry":"entry.666055268","categorias":[{"nombre":"Game of the Year","entry":"entry.1510643541","nominados":["007 First Light","Control Resonant","Grand Theft Auto 6","Phantom Blade Zero","Resident Evil Requiem","The Legend of Zelda: Ocarina of Time"]},{"nombre":"Best Game Direction","entry":"entry.1112216011","nominados":["Control Resonant","Grand Theft Auto 6","Phantom Blade Zero","Pragmata","Resident Evil Requiem"]},{"nombre":"Best Narrative","entry":"entry.146087116","nominados":["007 First Light","Control Resonant","Grand Theft Auto 6","Resident Evil Requiem","The Blood of Dawnwalker"]},{"nombre":"Best Art Direction","entry":"entry.1532372635","nominados":["Control Resonant","Grand Theft Auto 6","Mouse P.I. For Hire","Phantom Blade Zero","The Legend of Zelda: Ocarina of Time"]},{"nombre":"Best Score and Music","entry":"entry.2101580764","nominados":["Ace Combat 8: Wings of Theve","Grand Theft Auto 6","Mixtape","Phantom Blade Zero","The Legend of Zelda: Ocarina of Time"]},{"nombre":"Best Audio Design","entry":"entry.1264721507","nominados":["Ace Combat 8: Wings of Theve","Control Resonant","Grand Theft Auto 6","Resident Evil Requiem","Star Wars: Galactic Racer"]},{"nombre":"Best Performance","entry":"entry.511840256","nominados":["Patrick Gibson — 007 First Light","Angela Sant’Albano — Resident Evil Requiem","Liam McIntyre — Marvel’s Wolverine","Manni L. Perez — Grand Theft Auto 6","Rahul Kohli — Saros"]},{"nombre":"Games for Impact","entry":"entry.1372680658","nominados":["Big Walk","Cairn","Forever Ago","Life is Strange Reunion","Lily’s World XD","Mixtape"]},{"nombre":"Best Ongoing Game","entry":"entry.584249112","nominados":["Arc Raiders","Final Fantasy 14 Online","Fortnite","No Man’s Sky","The Witcher 3: Wild Hunt"]},{"nombre":"Best Community Support","entry":"entry.93529814","nominados":["Crimson Desert","Helldivers 2","No Man’s Sky","The Witcher 3: Wild Hunt","Warframe"]},{"nombre":"Best Independent Game","entry":"entry.1468412994","nominados":["Big Walk","Cairn","Denshattack","Mewgenics","Mina the Hollower"]},{"nombre":"Best Debut Indie Game","entry":"entry.1516689694","nominados":["Dressmaker","Esoteric Ebb","Orbitals","Replaced","Silver Pines"]},{"nombre":"Best Mobile Game","entry":"entry.1254379277","nominados":["Arknights Endfield","Monster Hunter Outlanders","Neverness to Everness","Pokemon Champions","Where Winds Meet"]},{"nombre":"Best VR/AR Game","entry":"entry.501783844","nominados":["Forefront","Into the Radious 2","Little Nightmares VR: Altered Echoes","Teenage Mutant Ninja Turtles: Empire City","Thief VR: Legacy of Shadow"]},{"nombre":"Best Action Game","entry":"entry.1441215488","nominados":["Ace Combat 8: Wings of Theve","Gears of War: E-Day","Onimusha: Way of the Sword","Phantom Blade Zero","Saros"]},{"nombre":"Best Action/Adventure Game","entry":"entry.1814154452","nominados":["007 First Light","Control Resonant","Grand Theft Auto 6","Pragmata","Resident Evil Requiem","The Legend of Zelda: Ocarina of Time"]},{"nombre":"Best Role-Playing Game","entry":"entry.966565647","nominados":["Final Fantasy Resonance","Fire Emblem: Fortune’s Weave","Monster Hunter Stories 3: Twisted Reflection","The Blood of Dawnwalker","Trails in the Sky: 2nd Chapter"]},{"nombre":"Best Fighting Game","entry":"entry.586071108","nominados":["2XKO","Avatar Legends: The Fighting Game","Invincible VS","Marvel Tokon: Fighting Souls","My Hero Academia: All’s Justice"]},{"nombre":"Best Family Game","entry":"entry.476891945","nominados":["Big Walk","Lego Batman: Legacy of the Dark Knight","Nintendo Switch Sports Resort","Pokemon Pokopia","Yoshi and the Mysterious Book"]},{"nombre":"Best Sim/Strategy Game","entry":"entry.153860258","nominados":["Mewgenics","Planet Zoo 2","Pokemon Pokopia","Slay the Spire 2","Star Wars Zero Company"]},{"nombre":"Best Sports/Racing Game","entry":"entry.1524879598","nominados":["EA Sports FC 27","Forza Horizon 6","Nintendo Switch Sports Resort","Screamer","Star Wars: Galactic Racer"]},{"nombre":"Best Multiplayer Game","entry":"entry.957152894","nominados":["Big Walk","Call of Duty: Modern Warfare 4","Gears of War: E-Day","Marathon","Meccha Chameleon","Orbitals"]},{"nombre":"Best Adaptation","entry":"entry.255990359","nominados":["Cyberpunk Edgerunners: Season 2","Fallout: Season 2","Mortal Kombat 2","Resident Evil","The Super Mario Galaxy Movie"]},{"nombre":"Innovation in Accessibility","entry":"entry.659724909","nominados":["Assassin’s Creed: Black Flag Resynced","Forza Horizon 6","Gears of War: E-Day","Marvel’s Wolverine","Rhythm Heaven Groove"]},{"nombre":"Most Anticipated Game","entry":"entry.1952318227","nominados":["Fable","Final Fantasy 7: Revelation","God of War Laufey","Resident Evil: Veronica","The Witcher 4"]},{"nombre":"Best Esports Game","entry":"entry.1581884370","nominados":["Counter Strike 2","Dota 2","League of Legends","Mobile Legends: Bang Bang","Valorant"]}]}/*/CONFIG*/;

/* Fecha de cierre opcional (hora local del votante). null = sin cierre. Ej: '2026-12-10T21:00:00-03:00' */
const CIERRE = null;

const STORE = 'vga2026-v1';
/* Orden de votación: de la categoría menos importante a la más importante (GOTY al final).
   Solo afecta a la web; el Form/Sheet identifican cada categoría por su entry. */
const ORDEN = [
    'Best Esports Game', 'Best Adaptation', 'Innovation in Accessibility', 'Best Mobile Game', 'Best VR/AR Game',
    'Best Family Game', 'Best Sports/Racing Game', 'Best Sim/Strategy Game', 'Best Fighting Game', 'Best Multiplayer Game',
    'Best Community Support', 'Best Ongoing Game', 'Most Anticipated Game', 'Games for Impact', 'Best Debut Indie Game',
    'Best Independent Game', 'Best Role-Playing Game', 'Best Action Game', 'Best Action/Adventure Game', 'Best Audio Design',
    'Best Score and Music', 'Best Performance', 'Best Art Direction', 'Best Narrative', 'Best Game Direction', 'Game of the Year',
];
const rank = n => { const i = ORDEN.indexOf(n); return i < 0 ? -1 : i; }; // las no listadas van primero
const cats = [...CONFIG.categorias].sort((a, b) => rank(a.nombre) - rank(b.nombre));
const GOTY = cats.find(c => c.nombre === 'Game of the Year');
const $ = id => document.getElementById(id);

/* ---------- estado ---------- */
let state = { alias: '', picks: {}, step: -1, sent: false };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

/* ---------- pantallas ---------- */
function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'shown'));
    const el = $(id);
    el.classList.add('active');
    document.body.classList.toggle('on-intro', id === 'intro');
    document.body.classList.toggle('on-done', id === 'done');
    window.scrollTo({ top: 0 });
    void el.offsetWidth; // fuerza reflow para que la transición de entrada arranque
    el.classList.add('shown');
    updateHud();
}

function updateHud() {
    const n = Object.keys(state.picks).filter(k => state.picks[k]).length;
    $('hudFill').style.width = (n / cats.length * 100) + '%';
    const pos = state.step >= 0 && state.step < cats.length ? state.step + 1 : cats.length;
    $('hudCount').innerHTML = `<b>${String(pos).padStart(2, '0')}</b> / ${cats.length}`;
    $('hudWho').textContent = state.alias;
}

const pad = n => String(n).padStart(2, '0');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Nombre de archivo de la portada: "Marvel’s Wolverine" → assets/covers/marvels-wolverine.jpg */
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const initials = s => esc(s.replace(/^(The|A)\s+/i, '').split(/[\s:]+/).filter(w => /^[A-Za-z0-9]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase());
/* "Actor — Juego" → nombre grande + juego chico */
function splitName(s) {
    const i = s.indexOf(' — ');
    return i < 0 ? { name: s, game: '' } : { name: s.slice(0, i), game: s.slice(i + 3) };
}

/* ---------- categoría ---------- */
let advanceTimer = null;
function renderCat(i) {
    clearTimeout(advanceTimer);
    state.step = i; save();
    const c = cats[i];
    $('catTitle').textContent = c.nombre;
    $('catKicker').innerHTML = `Categoría <b>${pad(i + 1)}</b> / ${cats.length} · ` +
        (c === GOTY ? '<b>El final boss</b>' : `${c.nominados.length} nominados`);
    const picked = state.picks[c.entry];
    const box = $('cards');
    box.classList.toggle('has-pick', !!picked);
    box.innerHTML = c.nominados.map((nom, k) => {
        const { name, game } = splitName(nom);
        const title = game || name;
        return `<button type="button" class="card reveal${nom === picked ? ' picked' : ''}" style="--d:${k + 2}" data-k="${k}" aria-pressed="${nom === picked}">
            <span class="cover" aria-hidden="true">${initials(title)}<img src="assets/covers/${slug(title)}.jpg" alt="" loading="lazy" onload="if(this.naturalWidth>this.naturalHeight)this.classList.add('wide')" onerror="this.remove()"></span>
            <span class="body">
                <span class="num">${pad(k + 1)}<span class="check"><svg viewBox="0 0 16 16" fill="none" stroke="#1a1208" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span></span>
                <span class="name">${esc(name)}${game ? `<span class="game">${esc(game)}</span>` : ''}</span>
            </span>
        </button>`;
    }).join('');
    $('prevBtn').disabled = false;
    $('nextBtn').textContent = i === cats.length - 1 ? 'Revisar ▸' : (picked ? 'Siguiente ▸' : 'Saltear ▸');
    show('cat');
}

function pick(k) {
    const i = state.step, c = cats[i];
    const nom = c.nominados[k];
    if (nom === undefined) return;
    state.picks[c.entry] = nom; save();
    const box = $('cards');
    box.classList.add('has-pick');
    box.querySelectorAll('.card').forEach(b => {
        const on = +b.dataset.k === k;
        b.classList.toggle('picked', on);
        b.setAttribute('aria-pressed', on);
    });
    $('nextBtn').textContent = i === cats.length - 1 ? 'Revisar ▸' : 'Siguiente ▸';
    updateHud();
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(next, 650);
}

function next() {
    if (state.step < cats.length - 1) renderCat(state.step + 1);
    else renderReview();
}
function prev() {
    if (state.step > 0) renderCat(state.step - 1);
    else { state.step = -1; save(); show('intro'); }
}

$('cards').addEventListener('click', e => {
    const b = e.target.closest('.card');
    if (b) pick(+b.dataset.k);
});
$('nextBtn').onclick = next;
$('prevBtn').onclick = prev;

document.addEventListener('keydown', e => {
    if (!$('cat').classList.contains('active') || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (/^[1-9]$/.test(e.key)) pick(+e.key - 1);
});

/* ---------- intro ---------- */
$('alias').value = state.alias || '';
$('aliasForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('alias').value.trim().replace(/\s+/g, ' ');
    if (v.length < 2) { $('aliasErr').textContent = 'Poné un alias de al menos 2 letras.'; $('alias').focus(); return; }
    $('aliasErr').textContent = '';
    state.alias = v; save();
    renderCat(state.step >= 0 && state.step < cats.length ? state.step : 0);
});

/* ---------- resumen ---------- */
function renderReview() {
    clearTimeout(advanceTimer);
    state.step = cats.length; save();
    $('voterName').textContent = state.alias;
    $('summary').innerHTML = cats.map((c, i) => {
        const p = state.picks[c.entry];
        return `<button type="button" class="row reveal${p ? '' : ' empty'}" style="--d:${Math.min(i, 12) * .35 + 2}" data-i="${i}">
            <span class="idx">${pad(i + 1)}</span>
            <span class="txt"><span class="cat">${esc(c.nombre)}</span><span class="pick">${p ? esc(p) : 'Sin elegir'}</span></span>
            <span class="edit">Editar</span>
        </button>`;
    }).join('');
    const missing = cats.filter(c => !state.picks[c.entry]).length;
    $('sendNote').className = 'note';
    $('sendNote').textContent = missing ? `Te faltan ${missing} categorías (podés enviar igual).` : '';
    $('sendBtn').disabled = false;
    $('sendBtn').textContent = 'Enviar pronóstico ▸';
    show('review');
}
$('summary').addEventListener('click', e => {
    const r = e.target.closest('.row');
    if (r) renderCat(+r.dataset.i);
});
$('backBtn').onclick = () => renderCat(cats.length - 1);

/* ---------- envío a Google Forms ---------- */
async function send() {
    if (CIERRE && Date.now() > new Date(CIERRE).getTime()) {
        $('sendNote').className = 'note err';
        $('sendNote').textContent = 'La votación ya cerró.';
        return;
    }
    const body = new URLSearchParams();
    body.append(CONFIG.aliasEntry, state.alias);
    cats.forEach(c => { if (state.picks[c.entry]) body.append(c.entry, state.picks[c.entry]); });

    $('sendBtn').disabled = true;
    $('sendBtn').textContent = 'Enviando…';
    $('sendNote').className = 'note';
    $('sendNote').textContent = '';
    try {
        // no-cors: Google no deja leer la respuesta; si la red responde, lo damos por enviado.
        await fetch(CONFIG.formAction, { method: 'POST', mode: 'no-cors', body });
        state.sent = true; save();
        renderDone();
    } catch (err) {
        $('sendBtn').disabled = false;
        $('sendBtn').textContent = 'Reintentar ▸';
        $('sendNote').className = 'note err';
        $('sendNote').textContent = 'No se pudo enviar. Revisá tu conexión y probá de nuevo.';
    }
}
$('sendBtn').onclick = send;

/* ---------- final ---------- */
function renderDone() {
    const n = cats.filter(c => state.picks[c.entry]).length;
    $('doneText').textContent = `${state.alias}, tu pronóstico de ${n} categorías quedó guardado. Si lo cambiás, cuenta el último que envíes.`;
    const goty = GOTY && state.picks[GOTY.entry];
    $('gotyBox').style.display = goty ? '' : 'none';
    $('gotyPick').textContent = goty || '';
    show('done');
}
$('againBtn').onclick = () => { state.sent = false; save(); renderReview(); };

/* ---------- arranque ---------- */
if (CIERRE && Date.now() > new Date(CIERRE).getTime() && !state.sent) {
    $('intro').querySelector('.sub').textContent = 'La votación ya cerró. ¡Nos vemos en la ceremonia!';
    $('aliasForm').style.display = 'none';
    show('intro');
} else if (state.sent) renderDone();
else show('intro');
</script>
</body>
</html>
