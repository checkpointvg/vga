<link rel="stylesheet" href="styles.css">
<style>
.app { max-width: 1280px; padding-bottom: 110px; }
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.top .logo { height: clamp(40px, 7vw, 70px); }
.top .spacer { flex: 1; }
.btn.sm { padding: 10px 14px; font-size: 13px; }

h1.title {
    margin-top: 22px; font: 700 clamp(40px, 8vw, 96px)/.95 var(--font-display); letter-spacing: -1px;
    text-shadow: 0 10px 50px rgba(0,0,0,0.6);
}
h1.title em { font-style: normal; color: var(--accent); text-shadow: 0 0 60px var(--glow); }
.meta {
    margin-top: 12px; display: flex; gap: 22px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
}
.meta b { color: var(--accent-2); }
.meta .live::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
    background: var(--hot); box-shadow: 0 0 10px var(--hot); animation: blink 1.4s steps(2) infinite; vertical-align: 1px;
}
@keyframes blink { 50% { opacity: .3; } }

/* último ganador revelado */
.last {
    margin-top: 24px; display: flex; align-items: center; gap: 16px; padding: 12px 18px 12px 12px;
    border-radius: 16px; background: rgba(26,33,49,0.92); border: 1px solid rgba(251,185,32,0.3); border-left: 6px solid var(--accent);
    max-width: 640px;
}
.last[hidden] { display: none; }
.last .thumb { position: relative; flex: none; width: 54px; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; background: #1c2334; }
.last .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; max-height: none; }
.last .thumb img.wide { object-fit: contain; padding: 4px; }
.last small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
.last b { display: block; margin-top: 4px; font: 700 clamp(19px, 2.6vw, 26px)/1.1 var(--font-display); }
.last span.cat { color: var(--accent-2); }
.last.flash { animation: flash 1.2s var(--ease-out-expo); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--glow); transform: scale(1.03); } 100% { box-shadow: 0 0 0 24px transparent; transform: none; } }

/* barras */
.board { position: relative; margin-top: 30px; }
.row {
    position: absolute; left: 0; right: 0; height: var(--rh);
    display: flex; align-items: center; gap: 14px;
    transition: transform .9s var(--ease-out-expo), opacity .5s;
}
.board { --rh: 58px; --gap: 10px; }
@media (min-width: 900px) { .board { --rh: 66px; --gap: 12px; } }
.row .pos {
    flex: none; width: 46px; text-align: right;
    font: 700 clamp(20px, 3vw, 30px) var(--font-display); color: var(--dim);
}
.row.p1 .pos { color: var(--accent-2); }
.row.p2 .pos, .row.p3 .pos { color: var(--text); }
.row .track {
    position: relative; flex: 1; height: 100%; border-radius: 12px; overflow: hidden;
    background: rgba(34,42,62,0.65); border: 1px solid var(--panel-line);
}
.row .bar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; min-width: 6px; border-radius: 12px;
    background: linear-gradient(90deg, var(--hot), var(--accent) 55%, var(--accent-2));
    box-shadow: 0 0 30px -6px var(--glow);
    transition: width 1.1s var(--ease-out-expo);
}
.row:not(.p1) .bar { background: linear-gradient(90deg, rgba(227,1,2,0.75), rgba(253,80,6,0.75)); box-shadow: none; }
.row .label {
    position: absolute; left: 16px; right: 16px; top: 0; bottom: 0;
    display: flex; align-items: center; gap: 10px;
    font: 600 clamp(17px, 2.4vw, 24px) var(--font-display); text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.row .label .alias { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .label .goty { flex: none; font: 700 11px var(--font-mono); letter-spacing: 2px; color: #1a1208; background: var(--accent-2); padding: 3px 7px; border-radius: 6px; text-shadow: none; }
.row .pts { flex: none; width: 64px; font: 700 clamp(22px, 3vw, 32px) var(--font-display); color: var(--accent); text-align: left; }
.row .pts small { font: 500 12px var(--font-mono); color: var(--dim); margin-left: 2px; }
.row.enter { opacity: 0; }

.empty {
    margin-top: 40px; padding: 40px 20px; text-align: center; border-radius: 18px;
    border: 2px dashed rgba(253,80,6,0.35); color: var(--muted); font-size: 19px;
}
.empty b { display: block; margin-bottom: 6px; font: 700 26px var(--font-display); color: var(--text); }
.foot-note { margin-top: 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }

.site-foot { transform: none !important; opacity: 1 !important; pointer-events: auto !important; position: static; margin-top: 30px; }

/* modo TV: sin controles, pensado para compartir pantalla */
body.tv .top .btn, body.tv .site-foot { display: none; }
</style>
</head>
<body>
<div class="fx" aria-hidden="true"><div class="grid"></div><div class="scan"></div></div>
<div class="hull-stripe" aria-hidden="true"></div>

<main class="app">
    <div class="top">
        <img class="logo" src="assets/logo-cierre.png" alt="Checkpoint Remastered">
        <span class="spacer"></span>
        <a class="btn ghost sm" href="./">Votar ▸</a>
        <button class="btn ghost sm" id="fsBtn" type="button">Pantalla completa</button>
    </div>

    <h1 class="title">Ranking<br><em>VGA 2026</em></h1>
    <div class="meta">
        <span class="live">En vivo</span>
        <span><b id="mReveladas">–</b> / 26 categorías</span>
        <span><b id="mVotantes">–</b> votantes</span>
    </div>

    <div class="last" id="last" hidden>
        <span class="thumb" id="lastThumb"></span>
        <div><small>Último ganador · <span class="cat" id="lastCat"></span></small><b id="lastWin"></b></div>
    </div>

    <div class="board" id="board" aria-live="polite"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="foot-note" id="note"></div>
</main>

<footer class="site-foot">
    <small>Seguí a Checkpoint</small>
    <nav class="social" aria-label="Redes de Checkpoint">
        <a href="https://www.youtube.com/@CheckpointVG" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg><span>YouTube</span></a>
        <a href="https://www.instagram.com/podcheckpoint/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.2.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg><span>Instagram</span></a>
        <a href="https://www.twitch.tv/checkpointvg" target="_blank" rel="noopener" aria-label="Twitch"><svg viewBox="0 0 24 24"><path d="M2.1 0 .5 4.2v17h5.7V24h3.2l3-2.8h4.6l6.1-6.1V0H2.1zm19 14.1-3.6 3.6h-5.7l-3 3v-3H4.2V2.1h16.9v12zM17.6 6.6v6.2h-2.1V6.6h2.1zm-5.7 0v6.2H9.8V6.6h2.1z"/></svg><span>Twitch</span></a>
    </nav>
</footer>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');          // ?demo → datos de prueba que cambian solos
if (params.has('tv')) document.body.classList.add('tv');  // ?tv → sin botones, para el stream
const POLL_MS = 10000;
const rows = new Map();                   // alias → elemento .row
let lastKey = '';

/* ---------- datos ---------- */
async function fetchData() {
    if (DEMO) return demoData();
    const r = await fetch(API_URL + '?' + new URLSearchParams({ action: 'ranking', limit: 10 }));
    return r.json();
}

let demo = null;
function demoData() {
    const names = ['diego_shepard', 'RionSteiner', 'lilia_psi', 'Fran', 'cammy_main', 'nemesis85', 'tomb_raidera', 'vault_boy', 'SnakeEater', 'pyramidhead', 'jill.sandwich', 'Mr.X'];
    if (!demo) demo = { rev: 0, pts: Object.fromEntries(names.map(n => [n, 0])), goty: {} };
    if (demo.rev < 26) {
        demo.rev++;
        names.forEach(n => { if (Math.random() < 0.55) demo.pts[n]++; });
        if (demo.rev === 26) names.forEach(n => { demo.goty[n] = Math.random() < 0.4; });
    }
    const list = names.map(n => ({ alias: n, puntos: demo.pts[n], goty: !!demo.goty[n] }))
        .sort((a, b) => b.puntos - a.puntos || b.goty - a.goty || a.alias.localeCompare(b.alias));
    list.forEach((r, i) => r.pos = i && list[i - 1].puntos === r.puntos && list[i - 1].goty === r.goty ? list[i - 1].pos : i + 1);
    const cat = CATS[demo.rev - 1];
    return { ok: true, votantes: 37, reveladas: demo.rev, total: 26,
        ultima: { categoria: cat.nombre, ganador: cat.nominados[demo.rev % cat.nominados.length], fecha: demo.rev },
        ranking: list.slice(0, 10) };
}

/* ---------- render ---------- */
function splitName(s) { const i = s.indexOf(' — '); return i < 0 ? { name: s, game: '' } : { name: s.slice(0, i), game: s.slice(i + 3) }; }

function render(d) {
    $('mReveladas').textContent = d.reveladas;
    $('mVotantes').textContent = d.votantes;

    // último ganador
    if (d.ultima) {
        const key = d.ultima.categoria + '|' + d.ultima.ganador;
        const { name, game } = splitName(d.ultima.ganador);
        $('lastCat').textContent = d.ultima.categoria;
        $('lastWin').textContent = d.ultima.ganador;
        $('lastThumb').innerHTML = `<img src="assets/covers/${slug(game || name)}.jpg" alt="" onload="if(this.naturalWidth>this.naturalHeight)this.classList.add('wide')" onerror="this.remove()">`;
        $('last').hidden = false;
        if (lastKey && key !== lastKey) { $('last').classList.remove('flash'); void $('last').offsetWidth; $('last').classList.add('flash'); }
        lastKey = key;
    } else $('last').hidden = true;

    // estados vacíos
    const empty = !d.votantes ? '<b>Todavía no hay votos</b>Compartí el link para que la gente vote.'
        : !d.reveladas ? '<b>Esperando el primer ganador…</b>El ranking arranca cuando se anuncie la primera categoría.' : '';
    $('empty').innerHTML = empty; $('empty').hidden = !empty;
    const list = empty ? [] : d.ranking.slice(0, 10);

    // barras: cada alias tiene su fila; se mueve con transform para que el reordenamiento se anime
    const board = $('board');
    const max = Math.max(1, d.reveladas);
    const seen = new Set();
    list.forEach((r, i) => {
        seen.add(r.alias);
        let el = rows.get(r.alias);
        if (!el) {
            el = document.createElement('div');
            el.className = 'row enter';
            el.innerHTML = `<span class="pos"></span><div class="track"><div class="bar"></div><div class="label"><span class="alias"></span></div></div><span class="pts"></span>`;
            el.querySelector('.alias').textContent = r.alias;
            el.style.transform = `translateY(calc(${list.length} * (var(--rh) + var(--gap))))`;
            board.appendChild(el);
            rows.set(r.alias, el);
            void el.offsetWidth;
        }
        el.classList.remove('enter', 'p1', 'p2', 'p3');
        if (r.pos <= 3) el.classList.add('p' + r.pos);
        el.style.transform = `translateY(calc(${i} * (var(--rh) + var(--gap))))`;
        el.querySelector('.pos').textContent = r.pos + 'º';
        el.querySelector('.pts').innerHTML = `${r.puntos}<small>pts</small>`;
        el.querySelector('.bar').style.width = (r.puntos / max * 100) + '%';
        const lbl = el.querySelector('.label');
        let badge = lbl.querySelector('.goty');
        if (r.goty && !badge) { badge = document.createElement('span'); badge.className = 'goty'; badge.textContent = 'GOTY ✓'; lbl.appendChild(badge); }
        if (!r.goty && badge) badge.remove();
    });
    rows.forEach((el, alias) => {
        if (!seen.has(alias)) { el.classList.add('enter'); setTimeout(() => { if (el.classList.contains('enter')) { el.remove(); rows.delete(alias); } }, 500); }
    });
    board.style.height = `calc(${list.length} * (var(--rh) + var(--gap)))`;
    $('note').textContent = list.length ? `Top 10 · 1 punto por acierto · desempata quien acertó GOTY` : '';
}

async function tick() {
    try {
        const d = await fetchData();
        if (d && d.ok) render(d);
    } catch (e) { /* reintenta en el próximo ciclo */ }
}
tick();
setInterval(() => { if (!document.hidden) tick(); }, DEMO ? 2500 : POLL_MS);

$('fsBtn').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
};
</script>
</body>
